<!DOCTYPE html>
<html>
  <head>
    <title>My Site</title>
    <!-- Pulling IBM Plex Mono from Google Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'IBM Plex Mono', monospace;
        max-width: 650px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.7; /* Extra breathing room makes text much more readable */
        background-color: #121212;
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <h1>~/home</h1>
    <p>This text uses a high-readability monospace font with increased line spacing for comfort.</p>
  </body>
</html>
